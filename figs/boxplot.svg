<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">Boxplot of Median Income in California Housing</title>
  <desc id="desc">A horizontal boxplot showing the distribution of median income, from 0.5 to 15.0, with a median near 3.5.</desc>
  <rect width="800" height="480" fill="white"/>
  <text x="400" y="48" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#222">Boxplot of Median Income in California Housing</text>
  <text x="400" y="438" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">Median Income</text>
  <g stroke="#b8b8b8" stroke-dasharray="5 5">
    <line x1="90" y1="95" x2="90" y2="365"/><line x1="182" y1="95" x2="182" y2="365"/>
    <line x1="274" y1="95" x2="274" y2="365"/><line x1="366" y1="95" x2="366" y2="365"/>
    <line x1="458" y1="95" x2="458" y2="365"/><line x1="550" y1="95" x2="550" y2="365"/>
    <line x1="642" y1="95" x2="642" y2="365"/><line x1="734" y1="95" x2="734" y2="365"/>
  </g>
  <g stroke="#333" stroke-width="2">
    <line x1="93" y1="230" x2="734" y2="230"/>
    <line x1="93" y1="185" x2="93" y2="275"/><line x1="734" y1="185" x2="734" y2="275"/>
    <rect x="182" y="160" width="195" height="140" fill="#79a9d1" stroke="#24547a"/>
    <line x1="274" y1="160" x2="274" y2="300" stroke="#a52222" stroke-width="4"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">
    <text x="90" y="390">0.5</text><text x="182" y="390">2.5</text><text x="274" y="390">4.5</text>
    <text x="366" y="390">6.5</text><text x="458" y="390">8.5</text><text x="550" y="390">10.5</text>
    <text x="642" y="390">12.5</text><text x="734" y="390">14.5</text>
  </g>
</svg>